{% extends "base.html" %}
{% block content %}
<h2>Quản lý Dịch vụ</h2>
<table class="table table-hover mt-3">
  <thead class="thead-light">
    <tr>
      <th>ID</th><th>Tên dịch vụ</th><th>Mô tả</th><th>Gói</th><th>Giá</th>
    </tr>
  </thead>
  <tbody>
    {% for s in services %}
    <tr>
      <td>{{ s["id_dt"] }}</td>
      <td>{{ s["name_dt"] }}</td>
      <td>{{ s["desc_dt"] }}</td>
      <td>{{ s["name_sd"] or "" }}</td>
      <td>{{ s["price_sd"] or "" }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
